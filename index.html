<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kahve Daveti ☕💕</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', 'Comic Sans MS', cursive, sans-serif;
  }

  body {
    background: linear-gradient(135deg, #ffdee9 0%, #ffc3d8 40%, #ffb3c8 70%, #ffd6e8 100%);
    background-size: 300% 300%;
    animation: gradientShift 12s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ---- Süzülen kalpler arka planı ---- */
  .heart-float {
    position: fixed;
    bottom: -60px;
    font-size: 24px;
    opacity: 0.7;
    animation: floatUp linear infinite;
    pointer-events: none;
    z-index: 1;
    filter: drop-shadow(0 2px 6px rgba(255, 100, 150, 0.3));
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) rotate(0deg) scale(1);
      opacity: 0;
    }
    10% { opacity: 0.8; }
    50% { transform: translateY(-50vh) rotate(20deg) scale(1.1); }
    100% {
      transform: translateY(-110vh) rotate(-15deg) scale(0.8);
      opacity: 0;
    }
  }

  /* ---- Kart ---- */
  .card {
    position: relative;
    z-index: 10;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 32px;
    padding: 52px 48px 44px;
    max-width: 460px;
    width: 90%;
    text-align: center;
    box-shadow:
      0 20px 60px rgba(255, 105, 150, 0.35),
      0 4px 16px rgba(255, 105, 150, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
    border: 2px solid rgba(255, 182, 205, 0.6);
    animation: cardIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes cardIn {
    from {
      opacity: 0;
      transform: translateY(40px) scale(0.9);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .coffee-icon {
    font-size: 64px;
    display: inline-block;
    animation: wiggle 2.5s ease-in-out infinite;
    filter: drop-shadow(0 4px 10px rgba(200, 120, 80, 0.3));
  }

  @keyframes wiggle {
    0%, 100% { transform: rotate(-6deg) translateY(0); }
    50%      { transform: rotate(6deg) translateY(-6px); }
  }

  .steam {
    font-size: 20px;
    opacity: 0.5;
    animation: steamRise 2s ease-in-out infinite;
    display: block;
    margin-bottom: -8px;
  }

  @keyframes steamRise {
    0%, 100% { transform: translateY(0); opacity: 0.3; }
    50%      { transform: translateY(-6px); opacity: 0.7; }
  }

  h1 {
    margin-top: 20px;
    font-size: clamp(1.35rem, 4vw, 1.7rem);
    color: #d6336c;
    line-height: 1.5;
    font-weight: 700;
    text-shadow: 0 2px 8px rgba(255, 180, 200, 0.5);
  }

  .hearts-deco {
    font-size: 18px;
    margin-top: 10px;
    letter-spacing: 8px;
    animation: pulseHearts 1.8s ease-in-out infinite;
  }

  @keyframes pulseHearts {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.15); }
  }

  /* ---- Butonlar ---- */
  .buttons {
    margin-top: 34px;
    display: flex;
    gap: 20px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    min-height: 70px;
  }

  button {
    border: none;
    border-radius: 50px;
    padding: 15px 40px;
    font-size: 1.1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    color: #fff;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.3s ease,
                font-size 0.35s ease,
                padding 0.35s ease,
                opacity 0.3s ease;
    letter-spacing: 0.5px;
  }

  #yesBtn {
    background: linear-gradient(135deg, #5dd39e, #34b878);
    box-shadow: 0 8px 24px rgba(52, 184, 120, 0.45),
                inset 0 1px 0 rgba(255,255,255,0.4);
    animation: heartbeat 1.6s ease-in-out infinite;
  }

  @media (hover: hover) {
    #yesBtn:hover {
      transform: scale(1.08) translateY(-3px);
      box-shadow: 0 12px 32px rgba(52, 184, 120, 0.6),
                  inset 0 1px 0 rgba(255,255,255,0.4);
    }
  }

  #yesBtn:active { transform: scale(0.96); }

  @keyframes heartbeat {
    0%, 100% { box-shadow: 0 8px 24px rgba(52, 184, 120, 0.45), 0 0 0 0 rgba(52, 184, 120, 0.5); }
    50%      { box-shadow: 0 8px 24px rgba(52, 184, 120, 0.45), 0 0 0 12px rgba(52, 184, 120, 0); }
  }

  #noBtn {
    background: linear-gradient(135deg, #ff8a9e, #f0526e);
    box-shadow: 0 8px 24px rgba(240, 82, 110, 0.4),
                inset 0 1px 0 rgba(255,255,255,0.3);
  }

  @media (hover: hover) {
    #noBtn:hover {
      transform: translateY(-2px);
    }
  }

  #noBtn:active { transform: scale(0.94); }

  .no-msg {
    margin-top: 18px;
    font-size: 0.95rem;
    color: #e2557a;
    min-height: 1.4em;
    font-style: italic;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .no-msg.show { opacity: 1; }

  /* ---- Başarı ekranı ---- */
  .success {
    display: none;
    animation: cardIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .success.show { display: block; }

  .success .big-heart {
    font-size: 72px;
    display: inline-block;
    animation: bigPulse 1s ease-in-out infinite;
    filter: drop-shadow(0 4px 14px rgba(255, 80, 130, 0.4));
  }

  @keyframes bigPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.2); }
  }

  .success h2 {
    margin-top: 18px;
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    background: linear-gradient(135deg, #d6336c, #ff6b9d, #d6336c);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 2.5s linear infinite;
    font-weight: 800;
  }

  @keyframes shimmer {
    to { background-position: 200% center; }
  }

  .success p {
    margin-top: 14px;
    color: #b0447a;
    font-size: 1.05rem;
  }

  /* ---- Konfeti ---- */
  .confetti {
    position: fixed;
    top: -20px;
    z-index: 100;
    pointer-events: none;
    animation: confettiFall linear forwards;
  }

  @keyframes confettiFall {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 1;
    }
    85% { opacity: 1; }
    100% {
      transform: translateY(110vh) rotate(720deg);
      opacity: 0;
    }
  }

  /* ---- Küçük ekranlar ---- */
  @media (max-width: 480px) {
    .card {
      padding: 36px 24px 32px;
      border-radius: 26px;
    }

    .coffee-icon { font-size: 52px; }

    .buttons {
      gap: 14px;
      margin-top: 28px;
    }

    button {
      padding: 14px 32px;
      font-size: 1rem;
    }
  }

  @media (max-height: 600px) {
    .card { padding: 28px 24px 26px; }
    .coffee-icon { font-size: 44px; }
    h1 { margin-top: 12px; }
    .buttons { margin-top: 20px; }
  }

  .card.shake {
    animation: shakeCard 0.4s ease;
  }

  @keyframes shakeCard {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px) rotate(-1deg); }
    75% { transform: translateX(8px) rotate(1deg); }
  }
</style>
</head>
<body>

  <div class="card" id="card">
    <div id="question">
      <span class="steam">☁️</span>
      <span class="coffee-icon">☕</span>
      <h1>Benimle bir kahve içmek ister misin geldiğimde?</h1>
      <div class="hearts-deco">💕 🌸 💕</div>
      <div class="buttons">
        <button id="yesBtn">Evet 💚</button>
        <button id="noBtn">Hayır</button>
      </div>
      <div class="no-msg" id="noMsg"></div>
    </div>

    <div class="success" id="success">
      <span class="big-heart">💖</span>
      <h2>Batmana geliyorum</h2>
      <p>Kahveler benden ☕💕</p>
    </div>
  </div>

<script>
  const yesBtn  = document.getElementById('yesBtn');
  const noBtn   = document.getElementById('noBtn');
  const noMsg   = document.getElementById('noMsg');
  const card    = document.getElementById('card');
  const question = document.getElementById('question');
  const success  = document.getElementById('success');

  /* --- Arka planda süzülen kalpler --- */
  const heartEmojis = ['💕', '💗', '🌸', '💖', '🩷', '✨'];
  function spawnFloatingHearts() {
    for (let i = 0; i < 14; i++) {
      const h = document.createElement('div');
      h.className = 'heart-float';
      h.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.fontSize = (16 + Math.random() * 22) + 'px';
      h.style.animationDuration = (7 + Math.random() * 8) + 's';
      h.style.animationDelay = (Math.random() * 10) + 's';
      document.body.appendChild(h);
    }
  }
  spawnFloatingHearts();

  /* --- Hayır butonu: her tıklamada küçülür, Evet büyür --- */
  const noMessages = [
    'Emin misin? 🥺',
    'Bir daha düşünsen? 💭',
    'Kahve çok güzel olur ama... ☕',
    'Kalbimi kırıyorsun 💔',
    'Son şansın! 🌸',
    'Bu buton artık çok küçük... 😌'
  ];
  let noCount = 0;

  noBtn.addEventListener('click', () => {
    noCount++;

    const noScale = Math.max(0.15, 1 - noCount * 0.16);
    // Evet butonu büyürken karttan ve ekrandan taşmasın (özellikle dar ekranlarda)
    const maxYesScale = Math.max(1.3, (card.clientWidth - 24) / yesBtn.offsetWidth);
    const yesScale = Math.min(1 + noCount * 0.22, maxYesScale);

    noBtn.style.transform = `scale(${noScale})`;
    noBtn.style.opacity = Math.max(0.35, 1 - noCount * 0.12);
    yesBtn.style.transform = `scale(${yesScale})`;

    noMsg.textContent = noMessages[Math.min(noCount - 1, noMessages.length - 1)];
    noMsg.classList.add('show');

    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');

    if (noCount >= 6) {
      noBtn.style.pointerEvents = 'none';
      noBtn.style.opacity = '0.2';
    }
  });

  /* --- Konfeti --- */
  const confettiColors = ['#ff6b9d', '#ffd166', '#5dd39e', '#6ec6ff', '#c792ea', '#ff8fab', '#fff3b0'];
  const confettiShapes = ['circle', 'rect', 'heart'];

  function launchConfetti(count) {
    for (let i = 0; i < count; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      const shape = confettiShapes[Math.floor(Math.random() * confettiShapes.length)];
      const color = confettiColors[Math.floor(Math.random() * confettiColors.length)];
      const size = 8 + Math.random() * 8;

      if (shape === 'heart') {
        c.textContent = ['💖', '💕', '🩷', '✨', '🌸'][Math.floor(Math.random() * 5)];
        c.style.fontSize = size + 6 + 'px';
      } else {
        c.style.width = size + 'px';
        c.style.height = (shape === 'rect' ? size * 0.5 : size) + 'px';
        c.style.background = color;
        c.style.borderRadius = shape === 'circle' ? '50%' : '2px';
      }

      c.style.left = Math.random() * 100 + 'vw';
      c.style.animationDuration = (2.2 + Math.random() * 2.5) + 's';
      c.style.animationDelay = (Math.random() * 0.6) + 's';
      document.body.appendChild(c);

      setTimeout(() => c.remove(), 6000);
    }
  }

  /* --- Evet! --- */
  yesBtn.addEventListener('click', () => {
    launchConfetti(120);
    setTimeout(() => launchConfetti(80), 700);
    setTimeout(() => launchConfetti(60), 1500);

    question.style.display = 'none';
    noMsg.style.display = 'none';
    success.classList.add('show');
  });
</script>
</body>
</html>
